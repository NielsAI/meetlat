name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here calls a `make` target that a person can run locally, so `make preflight`
# green means this workflow green. A check that exists only in this file is a check nobody
# can run before pushing (ADR-0006).

jobs:
  # 3.11 is the supported floor and 3.14 is what the author runs. Anything between is
  # covered by both ends moving together; a full matrix buys little for a package with
  # one dependency.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  # The gates that encode this project's own argument: no check ships without evidence,
  # and no judge reports a number its labels do not support. They need the package
  # installed for pydantic, so they share a job rather than each paying for a setup.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Layer 1 contract (ADR-0002)
        run: python scripts/check_zeef_contract.py
      - name: Calibration gate (ADR-0003, ADR-0004)
        run: python scripts/check_judges.py
      - name: ADR index is current
        run: python scripts/generate_adr_index.py --check
      - name: Gold set guard behaves as recorded (ADR-0006)
        run: python scripts/check_gold_write.py --selftest
      - name: Commit-message guard behaves as recorded (ADR-0006)
        run: python scripts/check_commit_msg.py --selftest

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
