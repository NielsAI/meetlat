name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here runs the same command a `make` target runs, so `make preflight` green
# means this workflow green. The commands are spelled out rather than invoked through
# make so a job failure names the tool that failed; keeping the two in step is therefore
# a thing to check, and `make preflight` is the list to check against. A check that
# exists only in this file is a check nobody can run before pushing (ADR-0006).

jobs:
  # 3.11 is the supported floor and 3.14 is what the author runs. Anything between is
  # covered by both ends moving together; a full matrix buys little for a package with
  # one dependency.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  # The gates that encode this project's own argument: no check ships without evidence,
  # and no judge reports a number its labels do not support. They need the package
  # installed for pydantic, so they share a job rather than each paying for a setup.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Layer 1 contract (ADR-0002)
        run: python scripts/check_zeef_contract.py
      - name: Calibration gate (ADR-0003, ADR-0004)
        run: python scripts/check_judges.py
      - name: ADR index is current
        run: python scripts/generate_adr_index.py --check
      - name: Gold set guard behaves as recorded (ADR-0006)
        run: python scripts/check_gold_write.py --selftest
      - name: Commit-message guard behaves as recorded (ADR-0006)
        run: python scripts/check_commit_msg.py --selftest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The official action derives a commit range from the push payload and scans
      # `<first>^..<last>`. A repository's root commit has no parent, so the very first
      # push to a new repo fails with "unknown revision 8f46702^..". Running the binary
      # over the whole history has no range to get wrong, and on a repository this size
      # it costs under a second.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # --redact so a finding never echoes the secret into a public log, which would
      # turn a warning into a second disclosure.
      - run: gitleaks detect --source . --redact --verbose
